<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sociwave - Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brandBg: '#fcf9f2',
                        brandOrange: '#f05a28',
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800">

    <div class="glass-panel p-6 md:p-12 my-8">
        
        <header class="flex justify-between items-center mb-12">
            <div class="flex items-center gap-2">
                <div class="bg-brandOrange text-white p-1.5 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <span class="font-bold text-lg tracking-tight">Sociwave</span>
            </div>
            
            <nav class="hidden md:flex gap-8 text-sm font-medium text-gray-600">
                <a href="#" class="hover:text-brandOrange transition">About</a>
                <a href="#" class="hover:text-brandOrange transition">Case Studies</a>
                <a href="#" class="hover:text-brandOrange transition">Services</a>
                <a href="#" class="hover:text-brandOrange transition">Pricing</a>
            </nav>

            <button class="bg-brandOrange text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-orange-600 transition shadow-md">
                Contact Us
            </button>
        </header>

        <div class="text-center max-w-2xl mx-auto mb-12">
            <p class="text-brandOrange text-xs font-bold tracking-widest mb-4 flex justify-center items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-brandOrange"></span> CONTACT US
            </p>
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 leading-tight mb-4">
                Let's discuss your next big project today.
            </h1>
            <p class="text-gray-500 text-sm md:text-base mb-8">
                Send us a message and we will respond quickly to arrange a personalized, valuable consultation.
            </p>
            
            <div class="flex justify-center gap-4">
                <button class="bg-white border border-gray-200 text-gray-800 px-6 py-2.5 rounded-full text-sm font-medium hover:bg-gray-50 transition">
                    See projects
                </button>
                <button class="bg-gray-900 text-white px-6 py-2.5 rounded-full text-sm font-medium hover:bg-black transition shadow-md">
                    Explore services
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm max-w-3xl mx-auto">
            <form id="contactForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                        <input type="text" id="fullName" placeholder="Jane Smith" class="w-full bg-gray-50 border border-transparent rounded-lg p-3 text-sm focus:bg-white transition" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+123 456 789 00" class="w-full bg-gray-50 border border-transparent rounded-lg p-3 text-sm focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" placeholder="test@gmail.com" class="w-full bg-gray-50 border border-transparent rounded-lg p-3 text-sm focus:bg-white transition" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Select Service</label>
                    <select id="service" class="w-full bg-gray-50 border border-transparent rounded-lg p-3 text-sm focus:bg-white transition text-gray-500" required>
                        <option value="" disabled selected>Select...</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX Design">UI/UX Design</option>
                        <option value="Digital Marketing">Digital Marketing</option>
                        <option value="Consultation">Consultation</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Message</label>
                    <textarea id="message" rows="4" placeholder="Tell us about your business..." class="w-full bg-gray-50 border border-transparent rounded-lg p-3 text-sm focus:bg-white transition" required></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-brandOrange text-white font-medium py-3 rounded-lg hover:bg-orange-600 transition shadow-md flex justify-center items-center gap-2">
                    <span id="btnText">Send Message</span>
                    <svg id="loader" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </form>

            <div id="formResponse" class="mt-4 text-center text-sm font-medium hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
